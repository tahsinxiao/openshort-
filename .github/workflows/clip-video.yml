# ─────────────────────────────────────────────────────────────────────────────
# Clip a long video with GitHub Actions — FREE, no credit card, runs even
# while your phone is off.
#
# HOW TO USE (all from your phone / browser):
#   1. (Once) Add your free AI key as a repository secret:
#        repo → Settings → Secrets and variables → Actions → New repository secret
#        Name: OPENROUTER_API_KEY   (or GEMINI_API_KEY / GROQ_API_KEY / ...)
#      Also add your YouTube cookies as a secret named YOUTUBE_COOKIES
#      (exported from Kiwi with the "Get cookies.txt LOCALLY" extension).
#   2. Run the workflow:
#        repo → Actions → "Clip a video" → Run workflow →
#        paste your YouTube/Kick/Twitch link → Run
#   3. When the run finishes (green), open it → Artifacts →
#        "clips-<run>" → download the ZIP with your finished 9:16 clips.
#
# NOTES
#   * Free on PUBLIC repos (unlimited minutes). Private repos: 2,000 min/month.
#   * Runner: 7 GB RAM / 2 CPU Ubuntu. Job cap: 6 hours (long podcasts fit).
#   * Artifacts are kept 90 days, then deleted — download your clips after.
#   * First run installs dependencies (~5-8 min). Later runs reuse the cache.
# ─────────────────────────────────────────────────────────────────────────────
name: Clip a video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video link (YouTube / Kick / Twitch / any yt-dlp source)'
        required: true
        type: string
      whisper_model:
        description: 'Whisper model — tiny = fast, base/small = better words'
        required: false
        default: 'tiny'
        type: choice
        options: ['tiny', 'base', 'small']
      output_format:
        description: 'Clip shape'
        required: false
        default: 'vertical'
        type: choice
        options: ['vertical', 'square', 'horizontal']

# Never run two clipping jobs at once (they share the runner budget).
concurrency:
  group: clip-videos
  cancel-in-progress: false

jobs:
  clip:
    name: Clip ${{ inputs.video_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 330   # under GitHub's 6-hour job cap
    env:
      WHISPER_MODEL: ${{ inputs.whisper_model }}
      WHISPER_COMPUTE: int8
      MAX_CONCURRENT_JOBS: 1
      # Your YouTube cookies (exported from Kiwi browser). REQUIRED — without
      # them YouTube blocks GitHub's datacenter IPs with "Sign in to confirm
      # you're not a bot". Add as a repo secret named YOUTUBE_COOKIES.
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      # OPTIONAL but RECOMMENDED for reliability: the phone-tunnel URL (e.g.
      # https://xxx.trycloudflare.com). When set, the download goes through
      # your phone's home IP, so YouTube never sees the Azure datacenter IP
      # and the bot-wall disappears. Add as a repo secret named PROXY_URL.
      PROXY_URL: ${{ secrets.PROXY_URL }}
      # PO-token provider (bgutil) — mints Proof-of-Origin tokens ON the runner
      # itself (no phone needed) so yt-dlp can pass YouTube's bot check even
      # from flagged Azure IPs. The workflow clones + builds it automatically;
      # this just points main.py at the built script.
      BGUTIL_SCRIPT_PATH: ${{ github.workspace }}/bgutil-ytdlp-pot-provider/server/src/generate_once.ts
      # Any free AI key you've stored as a repo secret is passed through.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check an AI key is configured
        run: |
          if [ -z "$OPENROUTER_API_KEY$GEMINI_API_KEY$GROQ_API_KEY$DEEPSEEK_API_KEY$ZHIPU_API_KEY$DASHSCOPE_API_KEY$MOONSHOT_API_KEY" ]; then
            echo "::error::No AI provider key found. Add one at:"
            echo "  repo → Settings → Secrets and variables → Actions →"
            echo "  New repository secret → OPENROUTER_API_KEY (or GEMINI_API_KEY)"
            exit 1
          fi
          echo "✅ AI key detected."

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ffmpeg + system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 \
            fontconfig fonts-liberation

      - name: Install PyTorch (CPU build — faster download, no GPU needed)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.11.0 torchvision==0.26.0 \
            || pip install torch==2.11.0 torchvision==0.26.0

      - name: Install the app + impersonation support
        run: |
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]" "curl_cffi<0.13" bgutil-ytdlp-pot-provider

      - name: Install Deno (YouTube needs it for JS challenges / PO tokens)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version

      - name: Install PO-token provider (bgutil) — mints tokens to pass the bot check
        run: |
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server
          deno install --allow-scripts=npm:canvas --frozen
          test -f src/generate_once.ts && echo "✅ bgutil PO-token script ready"

      - name: Clip the video 🎬
        run: |
          sudo mkdir -p /app && sudo chmod 777 /app
          mkdir -p output
          python -u main.py -u "${{ inputs.video_url }}" \
            -o output --format "${{ inputs.output_format }}"

      - name: Show what was produced
        run: |
          echo "=== Finished clips (subtitled) ==="
          find output -type f -name "subtitled_*.mp4" | sort
          echo "=== Metadata ==="
          find output -type f -name "*_metadata.json" | sort

      - name: Upload clips 📦
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: |
            output/subtitled_*.mp4
            output/**/*.json
          if-no-files-found: error
          retention-days: 90
